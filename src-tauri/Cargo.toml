[package]
name = "mix-engine"
version = "0.2.0"
edition = "2021"
description = "MIX Engine — AI-Native 3D Open World Game Builder (Tauri desktop shell)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
